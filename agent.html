<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1a1a1a">
<title>АГЕНТ — передача геолокации</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 16px; background: #f5f7fa; color: #1a1a1a; min-height: 100vh; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { font-size: 12px; color:#888; margin-bottom: 14px; letter-spacing: 1px; }
  .card { background: #fff; border-radius: 14px; padding: 16px;
          box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
  input, select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd;
                  border-radius: 10px; margin-bottom: 12px; background: #fafbfc;
                  -webkit-appearance: none; appearance: none; }
  input:focus, select:focus { outline: none; border-color: #0d6efd; background:#fff; }
  button { width: 100%; padding: 15px; font-size: 16px; font-weight: 600;
           border: none; border-radius: 12px; background: #1a1a1a; color: #fff;
           cursor: pointer; }
  button:active { transform: scale(.98); }
  button:disabled { background: #9aa; }
  button.stop { background: #dc3545; }
  button.ghost { background:#eef3f8; color:#1a1a1a; margin-top:8px; }
  .status { padding: 12px; border-radius: 12px; font-size: 14px; background: #eef3f8;
            margin-bottom: 10px; line-height: 1.45; }
  .status.on  { background: #d4f5dd; color: #0a5c2e; }
  .status.err { background: #ffe0e0; color: #900; }
  .status.warn{ background:#fff3cd; color:#7a5500; }
  .coords { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px;
            word-break: break-all; margin-bottom: 6px; }
  .small { font-size: 12px; color: #888; margin-top: 6px; line-height: 1.5; }
  .hidden { display: none !important; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%;
         background:#9aa; margin-right:8px; vertical-align:middle; }
  .dot.on  { background:#22c55e; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  #diag { background:#1a1a1a; color:#d0d0d0; font-family: ui-monospace, Menlo, monospace;
          font-size: 11px; padding: 10px; border-radius: 10px; margin-top: 8px;
          max-height: 260px; overflow-y: auto; line-height: 1.5; white-space: pre-wrap;
          word-break: break-all; }
  #diag .ok   { color:#6ee7a8; }
  #diag .fail { color:#ff8080; }
  #diag .warn { color:#ffd76e; }
  #diag .info { color:#8bb8ff; }

  .perm-icon { font-size: 40px; text-align: center; margin: 4px 0 10px; }
  .perm-title { text-align: center; font-weight: 600; font-size: 16px; margin: 0 0 6px; }
  .perm-text { text-align: center; font-size: 13px; color: #555; line-height: 1.5;
               margin: 0 0 14px; }
  details { margin-top: 10px; font-size: 13px; color:#555; }
  summary { cursor: pointer; color: #1a1a1a; font-weight: 500; }
</style>
</head>
<body>
  <h1>🕵️ АГЕНТ</h1>
  <div class="sub">ПЕРЕДАЧА ГЕОЛОКАЦИИ</div>

  <!-- Экран разрешения GPS -->
  <div class="card" id="permissionCard">
    <div class="perm-icon" id="permIcon">📍</div>
    <p class="perm-title" id="permTitle">Доступ к геолокации</p>
    <p class="perm-text" id="permText">
      Нажмите кнопку — браузер спросит разрешение. Без него передача работать не будет.
    </p>
    <button id="askPermBtn">📍 Разрешить доступ</button>
    <div class="status hidden" id="permStatus" style="margin-top:14px"></div>
  </div>

  <!-- Экран настроек -->
  <div class="card hidden" id="setupCard">
    <label for="name">Ваше имя *</label>
    <input id="name" placeholder="Например: Пётр Иванов" autocomplete="name">

    <label for="car">Машина / гос. номер</label>
    <input id="car" placeholder="Например: А123БВ 77" autocomplete="off">

    <label for="topic">Код группы *</label>
    <input id="topic" placeholder="park-a1b2c3" autocomplete="off">

    <label for="groupkey">Ключ группы *</label>
    <input id="groupkey" type="password" placeholder="выдаётся отдельно от кода" autocomplete="off">

    <button id="start">▶ Начать передачу</button>

    <details>
      <summary>Дополнительно</summary>
      <label for="broker" style="margin-top:10px">Сервер связи</label>
      <select id="broker">
        <option value="auto">Автоматически (рекомендуется)</option>
        <option value="broker.emqx.io:8084/mqtt">broker.emqx.io</option>
        <option value="broker.hivemq.com:8884/mqtt">broker.hivemq.com</option>
        <option value="test.mosquitto.org:8081/mqtt">test.mosquitto.org</option>
      </select>
      <div class="small">Если не подключается — попробуйте вручную.</div>
    </details>

    <button class="ghost" id="diagToggle">🩺 Показать диагностику</button>
    <div id="diag" class="hidden"></div>
  </div>

  <!-- Экран отслеживания -->
  <div class="card hidden" id="trackCard">
    <div class="status" id="status"><span class="dot"></span>Инициализация…</div>
    <div class="coords" id="coords">—</div>
    <div class="small" id="meta"></div>
    <button id="stop" class="stop hidden" style="margin-top:14px">⏹ Остановить передачу</button>
    <button class="ghost" id="diagToggle2">🩺 Диагностика</button>
    <div id="diag2" class="hidden" style="background:#1a1a1a;color:#d0d0d0;
         font-family:ui-monospace,monospace;font-size:11px;padding:10px;border-radius:10px;
         margin-top:8px;max-height:260px;overflow-y:auto;line-height:1.5;white-space:pre-wrap;
         word-break:break-all"></div>
  </div>

<script>
// ============================================================
//  ЛОГ
// ============================================================
const LOG = [];
function log(msg, kind) {
  const t = new Date().toLocaleTimeString('ru-RU');
  const line = `[${t}] ${msg}`;
  LOG.push({ line, kind });
  const html = LOG.map(x =>
    `<span class="${x.kind||'info'}">${escapeHtml(x.line)}</span>`
  ).join('\n');
  const el1 = document.getElementById('diag');
  const el2 = document.getElementById('diag2');
  if (el1) { el1.innerHTML = html; el1.scrollTop = el1.scrollHeight; }
  if (el2) { el2.innerHTML = html; el2.scrollTop = el2.scrollHeight; }
  console.log('[agent]', msg);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
//  CDN-загрузчик
// ============================================================
function loadScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = () => resolve(url);
    s.onerror = () => reject(new Error('fail ' + url));
    document.head.appendChild(s);
  });
}
function loadScriptAny(urls) {
  let p = Promise.reject();
  urls.forEach(u => { p = p.catch(() => loadScript(u)); });
  return p;
}
const MQTT_CDNS = [
  'https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.5/mqtt.min.js',
  'https://cdn.jsdelivr.net/npm/mqtt@5.3.5/dist/mqtt.min.js',
  'https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js'
];

// ============================================================
//  КРИПТО
// ============================================================
function bytesToB64url(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlToBytes(s) {
  const b64 = s.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function deriveRoomHash(groupCode, groupKey) {
  const data = new TextEncoder().encode(groupCode + ':' + groupKey + ':v1');
  const hash = await crypto.subtle.digest('SHA-256', data);
  const hex  = [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2, '0')).join('');
  return hex.slice(0, 24);
}

async function deriveCryptoKey(groupCode, groupKey) {
  const base = await crypto.subtle.importKey(
    'raw',
    new TextEncoder().encode(groupCode + ':' + groupKey + ':enc'),
    { name: 'PBKDF2' },
    false,
    ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: new TextEncoder().encode('rotacol-salt-v1'),
      iterations: 100000,
      hash: 'SHA-256'
    },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptPayload(key, obj) {
  const iv  = crypto.getRandomValues(new Uint8Array(12));
  const buf = new TextEncoder().encode(JSON.stringify(obj));
  const ct  = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, buf);
  const out = new Uint8Array(iv.length + ct.byteLength);
  out.set(iv, 0);
  out.set(new Uint8Array(ct), iv.length);
  return bytesToB64url(out);
}

// ============================================================
//  ОСНОВНАЯ ЛОГИКА
// ============================================================
(function () {
  const HEARTBEAT_MS  = 20000;
  const TOPIC_PREFIX  = 'rotacol-v1';

  const $ = id => document.getElementById(id);
  const permCard  = $('permissionCard');
  const setupCard = $('setupCard');
  const trackCard = $('trackCard');
  const permIcon  = $('permIcon');
  const permTitle = $('permTitle');
  const permText  = $('permText');
  const permStatus= $('permStatus');
  const askPermBtn= $('askPermBtn');

  const nameEl     = $('name');
  const carEl      = $('car');
  const topicEl    = $('topic');
  const groupKeyEl = $('groupkey');
  const brokerEl   = $('broker');
  const startBtn   = $('start');
  const stopBtn    = $('stop');
  const statusEl   = $('status');
  const coordsEl   = $('coords');
  const metaEl     = $('meta');

  let client = null;
  let cryptoKey = null;
  let watchId = null, heartbeatTimer = null;
  let lastSend = 0, lastCoords = null, wakeLock = null;
  let pubTopic = '';
  let permissionGranted = false;

  // --------- Стартовая диагностика ---------
  log('=== ДИАГНОСТИКА ОКРУЖЕНИЯ ===', 'info');
  log('URL: ' + location.href.slice(0, 120), 'info');
  log('Протокол: ' + location.protocol, location.protocol === 'https:' ? 'ok' : 'warn');
  log('Secure context: ' + (window.isSecureContext ? 'ДА' : 'НЕТ'),
      window.isSecureContext ? 'ok' : 'fail');
  log('geolocation: ' + (navigator.geolocation ? 'есть' : 'НЕТ'),
      navigator.geolocation ? 'ok' : 'fail');
  log('crypto.subtle: ' + (window.crypto && crypto.subtle ? 'есть' : 'НЕТ'),
      (window.crypto && crypto.subtle) ? 'ok' : 'fail');
  log('wakeLock: ' + ('wakeLock' in navigator ? 'есть' : 'нет'), 'info');

  if (location.protocol === 'file:' || location.protocol === 'content:') {
    log('❌ Страница открыта как ' + location.protocol +
        ' — Chrome Android ЗАПРЕЩАЕТ геолокацию и crypto.subtle!', 'fail');
  }
  if (location.protocol === 'http:' && !/localhost|127\.0\.0\.1/.test(location.host)) {
    log('❌ HTTP без HTTPS — браузер заблокирует и GPS, и криптографию.', 'fail');
  }

  // --------- Предзаполнение (без URL!) ---------
  try {
    nameEl.value     = localStorage.getItem('agent.name')  || '';
    carEl.value      = localStorage.getItem('agent.car')   || '';
    topicEl.value    = localStorage.getItem('agent.topic') || '';
    groupKeyEl.value = localStorage.getItem('agent.key')   || '';
    brokerEl.value   = localStorage.getItem('agent.broker')|| 'auto';
  } catch (e) {}

  // --------- Диагностика ---------
  $('diagToggle').addEventListener('click', () => $('diag').classList.toggle('hidden'));
  $('diagToggle2').addEventListener('click', () => $('diag2').classList.toggle('hidden'));

  // ============================================================
  //  РАЗРЕШЕНИЕ ГЕОЛОКАЦИИ
  // ============================================================
  function showPermStatus(text, kind) {
    permStatus.classList.remove('hidden', 'on', 'err', 'warn');
    if (kind) permStatus.classList.add(kind);
    permStatus.textContent = text;
  }

  function setPermGrantedUI() {
    permissionGranted = true;
    permIcon.textContent = '✅';
    permTitle.textContent = 'Доступ разрешён';
    permText.textContent = 'Всё готово. Переходим к настройкам.';
    askPermBtn.classList.add('hidden');
    showPermStatus('Геолокация разрешена', 'on');
    log('✅ Разрешение на геолокацию получено', 'ok');
    setTimeout(() => {
      permCard.classList.add('hidden');
      setupCard.classList.remove('hidden');
      nameEl.focus();
    }, 700);
  }

  function setPermDeniedUI() {
    permIcon.textContent = '🚫';
    permTitle.textContent = 'Доступ запрещён';
    permText.innerHTML = 'Разрешите геолокацию в Chrome:<br><br>' +
      '<b>Android:</b> 🔒 в адресной строке → «Разрешения» → «Местоположение» → «Разрешить».';
    askPermBtn.textContent = '🔁 Попробовать снова';
    askPermBtn.classList.remove('hidden');
    log('❌ В разрешении на геолокацию отказано', 'fail');
  }

  function requestPermission() {
    if (!navigator.geolocation) {
      permIcon.textContent = '❌';
      permTitle.textContent = 'Браузер не поддерживает геолокацию';
      askPermBtn.classList.add('hidden');
      log('❌ navigator.geolocation отсутствует', 'fail');
      return;
    }

    log('Запрашиваю разрешение через getCurrentPosition…', 'info');
    showPermStatus('Запрос разрешения… Отвечайте во всплывающем окне.');
    askPermBtn.disabled = true;
    askPermBtn.textContent = 'Ожидание…';

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        log('✅ Координаты получены: ' + pos.coords.latitude.toFixed(5) + ', ' +
            pos.coords.longitude.toFixed(5), 'ok');
        setPermGrantedUI();
      },
      (err) => {
        askPermBtn.disabled = false;
        askPermBtn.textContent = '📍 Разрешить доступ';
        log('❌ Ошибка GPS: code=' + err.code + ' ' + err.message, 'fail');

        if (err.code === 1) {
          if (location.protocol === 'file:' || location.protocol === 'content:') {
            log('   Причина — не HTTPS. Смотрите диагностику.', 'warn');
            showPermStatus('Нужен HTTPS-хостинг. Смотрите диагностику ниже.', 'err');
          } else if (!window.isSecureContext) {
            showPermStatus('Нужен HTTPS. Откройте страницу по защищённому адресу.', 'err');
          } else {
            setPermDeniedUI();
            showPermStatus('Доступ запрещён. Разрешите его в настройках.', 'err');
          }
        } else if (err.code === 2) {
          showPermStatus('GPS не отвечает. Выйдите на улицу.', 'warn');
        } else {
          showPermStatus('Тайм-аут GPS. Попробуйте ещё раз.', 'warn');
        }
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
    );
  }

  async function checkExistingPermission() {
    if (!navigator.permissions || !navigator.permissions.query) return;
    try {
      const result = await navigator.permissions.query({ name: 'geolocation' });
      log('Текущее состояние разрешения: ' + result.state, 'info');
      if (result.state === 'granted') setPermGrantedUI();
      else if (result.state === 'denied') setPermDeniedUI();
      result.onchange = () => {
        if (result.state === 'granted') setPermGrantedUI();
        else if (result.state === 'denied') setPermDeniedUI();
      };
    } catch (e) { log('Permissions API: ' + e.message, 'warn'); }
  }

  askPermBtn.addEventListener('click', requestPermission);
  checkExistingPermission();

  // ============================================================
  //  ВСПОМОГАТЕЛЬНЫЕ
  // ============================================================
  function getDriverId() {
    try {
      let id = localStorage.getItem('agent.id');
      if (!id) { id = 'a-' + Math.random().toString(36).slice(2, 8);
                 localStorage.setItem('agent.id', id); }
      return id;
    } catch { return 'a-' + Math.random().toString(36).slice(2, 8); }
  }

  function setStatus(text, kind) {
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
    statusEl.innerHTML = '<span class="dot ' + (kind === 'on' ? 'on' : '') +
                         '"></span>' + text;
  }

  function sanitize(s) {
    return String(s || '').trim().replace(/[^a-zA-Z0-9_\-]/g, '-').slice(0, 64);
  }

  async function publish(extra) {
    if (!client || !client.connected || !cryptoKey) return false;
    const payload = Object.assign({
      id:   getDriverId(),
      name: nameEl.value.trim() || 'Агент',
      car:  carEl.value.trim(),
      ts:   Date.now()
    }, extra || {});
    try {
      const packed = await encryptPayload(cryptoKey, payload);
      client.publish(pubTopic, packed, { qos: 1, retain: true });
      lastSend = Date.now();
      return true;
    } catch (e) {
      log('Ошибка шифрования: ' + e.message, 'fail');
      return false;
    }
  }

  function onPosition(pos) {
    const c = pos.coords;
    lastCoords = c;
    coordsEl.textContent = c.latitude.toFixed(6) + ', ' + c.longitude.toFixed(6) +
                           '   (±' + Math.round(c.accuracy) + ' м)';
    metaEl.textContent = 'Последняя отправка: ' + new Date().toLocaleTimeString('ru-RU');

    publish({
      lat: +c.latitude.toFixed(6), lng: +c.longitude.toFixed(6),
      accuracy: Math.round(c.accuracy),
      speed: c.speed != null ? +c.speed.toFixed(1) : null,
      heading: c.heading != null && !isNaN(c.heading) ? Math.round(c.heading) : null,
      event: 'position'
    }).then(ok => {
      if (ok) setStatus('✅ Передача активна', 'on');
      else    setStatus('⚠️ Нет связи с сервером — переподключение…', 'err');
    });
  }

  function onPositionError(err) {
    const map = { 1: 'Доступ к геолокации запрещён.', 2: 'GPS не определяет позицию.', 3: 'Тайм-аут GPS.' };
    log('Ошибка GPS watchPosition: code=' + err.code, 'fail');
    setStatus('❌ ' + (map[err.code] || err.message), 'err');
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        log('✅ WakeLock получен', 'ok');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { log('WakeLock: ' + e.message, 'warn'); }
  }

  // ============================================================
  //  MQTT — перебор брокеров
  // ============================================================
  function tryBroker(url, label, willPayload) {
    return new Promise((resolve, reject) => {
      log('Подключаюсь к ' + label + '…', 'info');
      const driverId = getDriverId();
      const opts = {
        clientId: 'a-' + driverId + '-' + Math.random().toString(16).slice(2, 8),
        clean: true, keepalive: 30, reconnectPeriod: 3000, connectTimeout: 10000,
        will: {
          topic: pubTopic,
          payload: willPayload,
          qos: 1, retain: true
        }
      };
      const c = mqtt.connect(url, opts);
      let resolved = false;
      const timeout = setTimeout(() => {
        if (!resolved) {
          resolved = true;
          log('❌ Тайм-аут к ' + label, 'fail');
          try { c.end(true); } catch {}
          reject(new Error('timeout'));
        }
      }, 11000);

      c.on('connect', () => {
        clearTimeout(timeout);
        log('✅ Подключено к ' + label, 'ok');
        if (!resolved) { resolved = true; resolve(c); }
      });
      c.on('error', (err) => {
        log('⚠️ ' + label + ': ' + (err.message || err), 'warn');
        if (!resolved) {
          clearTimeout(timeout);
          resolved = true;
          try { c.end(true); } catch {}
          reject(err);
        }
      });
    });
  }

  async function connectAnyBroker(willPayload) {
    let list;
    const manual = brokerEl.value;
    if (manual && manual !== 'auto') {
      list = [['wss://' + manual, manual]];
    } else {
      list = [
        ['wss://broker.emqx.io:8084/mqtt',     'broker.emqx.io'],
        ['wss://broker.hivemq.com:8884/mqtt',  'broker.hivemq.com'],
        ['wss://test.mosquitto.org:8081/mqtt', 'test.mosquitto.org']
      ];
    }
    for (const [url, label] of list) {
      try { return await tryBroker(url, label, willPayload); }
      catch (e) { log('Пробую следующий…', 'info'); }
    }
    throw new Error('ни один брокер не ответил');
  }

  // ============================================================
  //  СТАРТ
  // ============================================================
  startBtn.addEventListener('click', async () => {
    const name = nameEl.value.trim();
    const code = sanitize(topicEl.value);
    const key  = groupKeyEl.value.trim();

    if (!name) { nameEl.focus(); nameEl.style.borderColor = '#dc3545'; return; }
    if (!code) { topicEl.focus(); topicEl.style.borderColor = '#dc3545'; return; }
    if (!key)  { groupKeyEl.focus(); groupKeyEl.style.borderColor = '#dc3545';
                 alert('Введите ключ группы.'); return; }

    if (!permissionGranted) {
      alert('Сначала разрешите доступ к геолокации.');
      permCard.classList.remove('hidden');
      setupCard.classList.add('hidden');
      return;
    }

    if (!window.crypto || !crypto.subtle) {
      log('❌ crypto.subtle недоступен — нужен HTTPS', 'fail');
      alert('Криптография недоступна. Откройте страницу по HTTPS.');
      return;
    }

    log('=== СТАРТ ПЕРЕДАЧИ ===', 'info');

    try {
      localStorage.setItem('agent.name',   name);
      localStorage.setItem('agent.car',    carEl.value.trim());
      localStorage.setItem('agent.topic',  topicEl.value.trim());
      localStorage.setItem('agent.key',    key);
      localStorage.setItem('agent.broker', brokerEl.value);
    } catch {}

    setupCard.classList.add('hidden');
    trackCard.classList.remove('hidden');
    startBtn.disabled = true;
    setStatus('Криптографическая подготовка…');

    // --- Производные от кода+ключа
    try {
      const t0 = Date.now();
      const roomHash = await deriveRoomHash(code, key);
      cryptoKey      = await deriveCryptoKey(code, key);
      const driverId = getDriverId();
      pubTopic       = TOPIC_PREFIX + '/' + roomHash + '/' + driverId;
      log('✅ Крипто-параметры вычислены за ' + (Date.now() - t0) + ' мс', 'ok');
      log('Топик: ' + pubTopic.slice(0, 40) + '…', 'info');
    } catch (e) {
      log('❌ Крипто: ' + e.message, 'fail');
      setStatus('❌ Не удалось подготовить шифрование.', 'err');
      startBtn.disabled = false;
      setupCard.classList.remove('hidden');
      trackCard.classList.add('hidden');
      return;
    }

    // --- Библиотека
    setStatus('Загрузка MQTT-библиотеки…');
    try {
      const used = await loadScriptAny(MQTT_CDNS);
      log('✅ mqtt.js загружен: ' + used, 'ok');
    } catch (e) {
      log('❌ mqtt.js не загрузился ни с одного CDN', 'fail');
      setStatus('❌ CDN недоступен.', 'err');
      startBtn.disabled = false;
      setupCard.classList.remove('hidden');
      trackCard.classList.add('hidden');
      return;
    }

    // --- Шифруем LWT заранее
    let willPayload;
    try {
      willPayload = await encryptPayload(cryptoKey, {
        id:   getDriverId(),
        name: nameEl.value.trim(),
        event:'offline',
        ts:   Date.now()
      });
    } catch (e) { willPayload = ''; }

    setStatus('Подключение к серверу…');
    try {
      client = await connectAnyBroker(willPayload);
    } catch (e) {
      log('❌ Все брокеры недоступны: ' + e.message, 'fail');
      setStatus('❌ Не удалось подключиться к серверу связи.', 'err');
      startBtn.disabled = false;
      setupCard.classList.remove('hidden');
      trackCard.classList.add('hidden');
      return;
    }

    client.on('reconnect', () => { log('MQTT: переподключение…', 'warn');
                                   setStatus('Переподключение…', 'warn'); });
    client.on('close',     () => { log('MQTT: соединение закрыто', 'warn');
                                   setStatus('Нет связи, переподключение…', 'err'); });
    client.on('error',     (e) => { log('MQTT error: ' + (e.message||e), 'fail'); });

    publish({ event: 'start' });

    log('Запускаю watchPosition…', 'info');
    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
      enableHighAccuracy: true, maximumAge: 3000, timeout: 30000
    });

    heartbeatTimer = setInterval(() => {
      if (!lastCoords) return;
      if (Date.now() - lastSend < HEARTBEAT_MS - 1000) return;
      const c = lastCoords;
      publish({
        lat: +c.latitude.toFixed(6), lng: +c.longitude.toFixed(6),
        accuracy: Math.round(c.accuracy),
        event: 'heartbeat'
      });
    }, HEARTBEAT_MS);

    stopBtn.classList.remove('hidden');
    requestWakeLock();
  });

  // ============================================================
  //  СТОП
  // ============================================================
  stopBtn.addEventListener('click', () => {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    watchId = null; heartbeatTimer = null;

    publish({
      event: 'stop',
      lat: lastCoords ? +lastCoords.latitude.toFixed(6)  : null,
      lng: lastCoords ? +lastCoords.longitude.toFixed(6) : null
    });

    if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
    setTimeout(() => { if (client) { try { client.end(true); } catch {} client = null; } }, 700);

    setStatus('Передача остановлена. Последняя точка сохранена у НЕБУШКА.');
    stopBtn.classList.add('hidden');
    startBtn.disabled = false;
    setTimeout(() => {
      trackCard.classList.add('hidden');
      setupCard.classList.remove('hidden');
    }, 1500);
  });

  window.addEventListener('beforeunload', () => {
    if (!client || !client.connected || !cryptoKey) return;
    try {
      encryptPayload(cryptoKey, {
        id:   getDriverId(),
        name: nameEl.value.trim(),
        event:'offline',
        ts:   Date.now()
      }).then(packed => {
        try {
          client.publish(pubTopic, packed, { qos: 1, retain: true });
        } catch {}
      });
    } catch {}
  });
})();
</script>
</body>
</html>
