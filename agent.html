<!-- MQTT.js с каскадным фолбэком -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.5/mqtt.min.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/mqtt@5.3.5/dist/mqtt.min.js';document.head.appendChild(s)"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';document.head.appendChild(s)"></script>

<script>
/* =====================================================================
   AGENT — RotaCol
   ===================================================================== */
'use strict';

/* ---------------- логи ---------------- */
function dlog(msg, cls) {
  var line = '[' + new Date().toLocaleTimeString('ru-RU') + '] ' + msg;
  ['log-setup','log-live'].forEach(function(id){
    var el = document.getElementById(id);
    if (!el) return;
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = line;
    el.appendChild(d);
    while (el.children.length > 200) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  });
  console.log('[agent]', msg);
}

/* ---------------- состояние ---------------- */
var state = {
  id:       null,          // agent.id (a-xxxxxx)
  name:     '',
  car:      '',
  topic:    '',            // код группы
  key:      '',            // ключ группы
  broker:   'auto',
  mapStyle: 'positron',
  topicPrefix: null,       // rotacol-v1/<hash24>
  cryptoKey: null,         // CryptoKey AES-GCM
  client:   null,
  connected: false,
  watching: false,
  watchId: null,
  lastLat: null, lastLng: null, lastAcc: null, lastSpd: null,
  heartbeatTimer: null,
  wakeLock: null,
  map: null, marker: null, accuracyCircle: null, tileLayer: null
};

/* ---------------- localStorage ---------------- */
function lsGet(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : v; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

/* ---------------- утилиты ---------------- */
function sanitize(s){ return String(s||'').replace(/[^a-zA-Z0-9_\-]/g,'').slice(0,64); }
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function b64u(bytes){
  var s = btoa(String.fromCharCode.apply(null, bytes));
  return s.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64u(str){
  str = String(str).replace(/-/g,'+').replace(/_/g,'/');
  while (str.length % 4) str += '=';
  var bin = atob(str);
  var arr = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
function genAgentId(){
  return 'a-' + Math.random().toString(36).slice(2, 8);
}
function humanAgo(ts){
  if (!ts) return '—';
  var d = Math.max(0, Math.floor((Date.now()-ts)/1000));
  if (d < 60) return d + ' с назад';
  if (d < 3600) return Math.floor(d/60) + ' мин назад';
  if (d < 86400) return Math.floor(d/3600) + ' ч назад';
  return Math.floor(d/86400) + ' дн назад';
}

/* ---------------- крипто ---------------- */
async function deriveTopicHash(code, key){
  var data = new TextEncoder().encode(code + ':' + key + ':v1');
  var buf = await crypto.subtle.digest('SHA-256', data);
  var hex = Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  return hex.slice(0, 24);
}
async function deriveAesKey(code, key){
  var raw = new TextEncoder().encode(code + ':' + key + ':v1');
  var baseKey = await crypto.subtle.importKey('raw', raw, { name:'PBKDF2' }, false, ['deriveKey']);
  var salt = new TextEncoder().encode('rotacol-salt-v1');
  return await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: salt, iterations: 100000, hash:'SHA-256' },
    baseKey, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
async function encryptPayload(obj){
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var data = new TextEncoder().encode(JSON.stringify(obj));
  var ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv: iv }, state.cryptoKey, data);
  var out = new Uint8Array(iv.length + ct.byteLength);
  out.set(iv, 0); out.set(new Uint8Array(ct), iv.length);
  return b64u(out);
}
/* ВАЖНО: payload от MQTT.js приходит как Buffer/Uint8Array с UTF-8 байтами
   base64url-строки. Сначала декодируем в строку, потом base64url → bytes. */
async function decryptPayload(payload){
  var str;
  if (typeof payload === 'string') {
    str = payload;
  } else if (payload instanceof Uint8Array) {
    str = new TextDecoder('utf-8').decode(payload);
  } else {
    str = String(payload);
  }
  var raw = unb64u(str);
  if (raw.length < 13) throw new Error('короткий payload (' + raw.length + ' байт)');
  var iv = raw.slice(0,12);
  var ct = raw.slice(12);
  var pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, state.cryptoKey, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------------- брокеры ---------------- */
var BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt'
];
function brokerList(){
  if (state.broker && state.broker !== 'auto') return [state.broker];
  return BROKERS.slice();
}

/* Настоящий MQTT Will: брокер сам опубликует зашифрованный "offline" в наш
   топик, если связь оборвётся аварийно (телефон потерял сеть и т.п.). */
async function tryConnect(url){
  var willTopic = state.topicPrefix + '/' + state.id;
  var willPayload = await encryptPayload({ t:'off', ts: Date.now() });

  return new Promise(function(resolve, reject){
    var c = mqtt.connect(url, {
      clientId: 'agent-' + state.id + '-' + Math.random().toString(36).slice(2,7),
      clean: true,
      reconnectPeriod: 5000,
      connectTimeout: 8000,
      keepalive: 30,
      will: {
        topic: willTopic,
        payload: willPayload,
        qos: 0,
        retain: false
      }
    });
    var to = setTimeout(function(){ try { c.end(true); } catch(e){} reject(new Error('таймаут')); }, 9000);
    c.once('connect', function(){
      clearTimeout(to);
      dlog('✅ Подключено: ' + url, 'i');
      resolve(c);
    });
    c.once('error', function(err){
      clearTimeout(to);
      try { c.end(true); } catch(e){}
      reject(err);
    });
  });
}
async function connectAnyBroker(){
  var list = brokerList();
  var lastErr = null;
  for (var i=0;i<list.length;i++){
    var url = list[i];
    try {
      dlog('Подключение к ' + url + '…', 'i');
      var c = await tryConnect(url);
      return c;
    } catch (e) {
      lastErr = e;
      dlog('Не удалось: ' + (e && e.message || e), 'w');
    }
  }
  throw lastErr || new Error('Все брокеры недоступны');
}

/* ---------------- стили карт ---------------- */
var TILES = {
  'positron':    { url:'https://tiles.openfreemap.org/styles/positron/{z}/{x}/{y}.png', attr:'© OpenFreeMap', max:19 },
  'osm-hot':     { url:'https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', attr:'© OSM HOT', max:19 },
  'osm-de':      { url:'https://tile.openstreetmap.de/{z}/{x}/{y}.png', attr:'© OSM DE', max:19 },
  'esri-street': { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attr:'© Esri', max:19 },
  'topo':        { url:'https://a.tile.opentopomap.org/{z}/{x}/{y}.png', attr:'© OpenTopoMap', max:17 },
  'sat':         { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attr:'© Esri', max:19 }
};
function applyTileStyle(which){
  var t = TILES[which] || TILES.positron;
  if (state.tileLayer) state.map.removeLayer(state.tileLayer);
  state.tileLayer = L.tileLayer(t.url, { maxZoom: t.max, attribution: t.attr }).addTo(state.map);
  state.mapStyle = which;
  lsSet('agent.baseMap', which);
  var sel = document.getElementById('map-style-live');
  if (sel) sel.value = which;
}

/* ---------------- UI: экраны ---------------- */
function showScreen(id){
  ['scr-perm','scr-setup','scr-track'].forEach(function(x){
    var el = document.getElementById(x);
    if (el) el.classList.toggle('on', x === id);
  });
}

/* ---------------- GPS ---------------- */
async function requestGpsPermission(){
  var el = document.getElementById('perm-status');
  el.textContent = 'Запрос…';
  try {
    if (!navigator.geolocation) throw new Error('Геолокация не поддерживается');
    if (!window.isSecureContext) throw new Error('Нужен https:// (сейчас ' + location.protocol + ')');
    await new Promise(function(res, rej){
      navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 15000 });
    });
    el.innerHTML = '<span class="gps-ok">✅ Разрешение получено</span>';
    dlog('GPS разрешён', 'i');
    setTimeout(function(){ showScreen('scr-setup'); }, 500);
  } catch (e) {
    el.innerHTML = '<span class="gps-bad">❌ ' + escHtml(e.message || e) + '</span>';
    dlog('GPS ошибка: ' + (e.message || e), 'e');
  }
}

function startWatch(){
  if (state.watching) return;
  state.watching = true;
  state.watchId = navigator.geolocation.watchPosition(onPosition, function(err){
    dlog('watchPosition ошибка: ' + (err.message || err.code), 'e');
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  dlog('watchPosition запущен', 'i');
}
function stopWatch(){
  if (state.watchId != null) {
    navigator.geolocation.clearWatch(state.watchId);
    state.watchId = null;
  }
  state.watching = false;
}
function onPosition(pos){
  state.lastLat = pos.coords.latitude;
  state.lastLng = pos.coords.longitude;
  state.lastAcc = pos.coords.accuracy;
  state.lastSpd = pos.coords.speed;
  renderCoords();
  updateMiniMarker();
  publishPosition();
}
function renderCoords(){
  var c = document.getElementById('co-coords');
  var m = document.getElementById('co-meta');
  var i = document.getElementById('co-info');
  if (state.lastLat == null){ c.textContent = '— — —'; return; }
  c.textContent = state.lastLat.toFixed(6) + ', ' + state.lastLng.toFixed(6);
  m.textContent = 'точность ±' + Math.round(state.lastAcc || 0) + ' м · обновлено ' + humanAgo(Date.now());
  var spd = state.lastSpd != null && state.lastSpd >= 0 ? (state.lastSpd * 3.6).toFixed(1) + ' км/ч' : '— км/ч';
  i.textContent = 'Скорость: ' + spd;
}
function updateMiniMarker(){
  if (!state.map || state.lastLat == null) return;
  var ll = [state.lastLat, state.lastLng];
  if (!state.marker){
    state.marker = L.circleMarker(ll, {
      radius: 8, color: '#fff', weight: 3, fillColor: '#000', fillOpacity: 1
    }).addTo(state.map);
    state.accuracyCircle = L.circle(ll, {
      radius: state.lastAcc || 10, color: '#1f6feb', weight: 1, fillColor: '#1f6feb', fillOpacity: .12
    }).addTo(state.map);
    state.map.setView(ll, 16);
  } else {
    state.marker.setLatLng(ll);
    state.accuracyCircle.setLatLng(ll);
    state.accuracyCircle.setRadius(state.lastAcc || 10);
  }
}

/* ---------------- публикация ---------------- */
async function publishPosition(){
  if (!state.client || !state.connected || state.lastLat == null) return;
  var obj = {
    t: 'pos',
    lat: state.lastLat, lng: state.lastLng,
    acc: state.lastAcc, spd: state.lastSpd,
    name: state.name, car: state.car,
    ts: Date.now()
  };
  try {
    var p = await encryptPayload(obj);
    state.client.publish(state.topicPrefix + '/' + state.id, p, { qos:0, retain:false });
  } catch (e) {
    dlog('Ошибка публикации: ' + (e.message || e), 'e');
  }
}

/* ---------------- heartbeat ---------------- */
function startHeartbeat(){
  stopHeartbeat();
  state.heartbeatTimer = setInterval(function(){
    if (state.lastLat == null) return;
    publishPosition();
  }, 20000);
  dlog('Heartbeat каждые 20с', 'i');
}
function stopHeartbeat(){
  if (state.heartbeatTimer){ clearInterval(state.heartbeatTimer); state.heartbeatTimer = null; }
}

/* ---------------- Wake Lock ---------------- */
async function acquireWakeLock(){
  try {
    if ('wakeLock' in navigator) {
      state.wakeLock = await navigator.wakeLock.request('screen');
      dlog('Wake Lock активен', 'i');
      state.wakeLock.addEventListener('release', function(){
        dlog('Wake Lock отпущен', 'w');
      });
    }
  } catch (e) { dlog('Wake Lock недоступен: ' + (e.message || e), 'w'); }
}
function releaseWakeLock(){
  try { if (state.wakeLock) state.wakeLock.release(); } catch(e){}
  state.wakeLock = null;
}

/* ---------------- запуск/останов передачи ---------------- */
async function startTracking(){
  var name = document.getElementById('in-name').value.trim();
  var car  = document.getElementById('in-car').value.trim();
  var code = sanitize(document.getElementById('in-topic').value);
  var key  = document.getElementById('in-key').value;
  if (!name) { alert('Введите имя'); return; }
  if (!code) { alert('Введите код группы (a-zA-Z0-9_-)'); return; }
  if (!key)  { alert('Введите ключ группы'); return; }

  state.name = name; state.car = car;
  state.topic = code; state.key = key;
  state.broker = document.getElementById('in-broker').value;
  state.mapStyle = document.getElementById('in-map').value;

  lsSet('agent.name', name);
  lsSet('agent.car', car);
  lsSet('agent.topic', code);
  lsSet('agent.key', key);
  lsSet('agent.broker', state.broker);
  lsSet('agent.baseMap', state.mapStyle);

  try {
    dlog('Вывод ключей…', 'i');
    var hash = await deriveTopicHash(code, key);
    state.topicPrefix = 'rotacol-v1/' + hash;
    state.cryptoKey = await deriveAesKey(code, key);
    dlog('Топик группы: ' + state.topicPrefix, 'i');
  } catch (e) {
    dlog('Крипто не работает: ' + (e.message || e), 'e');
    alert('Крипто не работает: ' + (e.message || e));
    return;
  }

  try {
    state.client = await connectAnyBroker();
    state.connected = true;
  } catch (e) {
    dlog('Не удалось подключиться: ' + (e.message || e), 'e');
    alert('MQTT: ' + (e.message || e));
    return;
  }

  setupClient();
  showScreen('scr-track');
  initMiniMap();
  startWatch();
  startHeartbeat();
  acquireWakeLock();

  var st = document.getElementById('st-status');
  st.textContent = '✅ Передача активна';
  st.classList.remove('off'); st.classList.add('on');
}

function setupClient(){
  var c = state.client;
  c.on('connect', function(){
    state.connected = true;
    dlog('MQTT reconnect — восстанавливаю подписку', 'i');
    try { c.subscribe(state.topicPrefix + '/+', { qos:0 }); } catch(e){}
  });
  c.on('close', function(){
    state.connected = false;
    dlog('MQTT отключён', 'w');
    var st = document.getElementById('st-status');
    st.textContent = '⚠️ Нет связи — переподключение…';
    st.classList.remove('on'); st.classList.add('off');
  });
  c.on('error', function(err){ dlog('MQTT error: ' + (err.message || err), 'e'); });

  c.on('message', async function(topic, payload){
    if (window.RotaFeatures && await RotaFeatures.handleMessage(topic, payload)) return;
  });

  // подписка сразу после подключения
  try { c.subscribe(state.topicPrefix + '/+', { qos:0 }); } catch(e){}

  // features (видимость агентов, сообщения диспетчера)
  if (window.RotaFeatures) {
    RotaFeatures.attach({
      client:      c,
      topicPrefix: state.topicPrefix,
      encrypt:     encryptPayload,
      decrypt:     decryptPayload,
      dlog:        dlog
    });
  }
}

function stopTracking(){
  stopWatch();
  stopHeartbeat();
  releaseWakeLock();

  // корректный offline при ручной остановке (не через LWT)
  try {
    if (state.client && state.connected && state.cryptoKey) {
      encryptPayload({ t:'off', ts: Date.now() }).then(function(p){
        try { state.client.publish(state.topicPrefix + '/' + state.id, p, { qos:0, retain:false }); } catch(e){}
      });
    }
  } catch(e){}

  var st = document.getElementById('st-status');
  st.textContent = '⏸ Передача остановлена';
  st.classList.remove('on'); st.classList.add('off');

  setTimeout(function(){
    if (state.client){ try { state.client.end(true); } catch(e){} state.client = null; }
    state.connected = false;
    showScreen('scr-setup');
  }, 300);
}

/* ---------------- мини-карта ---------------- */
function initMiniMap(){
  if (state.map) {
    applyTileStyle(state.mapStyle);
    if (window.RotaFeatures && RotaFeatures.redrawOtherAgents) RotaFeatures.redrawOtherAgents();
    return;
  }
  state.map = L.map('minimap', { zoomControl: false, attributionControl: false })
                .setView([55.75, 37.62], 14);
  // даём features.js найти карту
  window.agentMap = state.map;
  applyTileStyle(state.mapStyle);

  var sel = document.getElementById('map-style-live');
  Object.keys(TILES).forEach(function(k){
    var o = document.createElement('option'); o.value = k; o.textContent = k;
    if (k === state.mapStyle) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', function(){
    applyTileStyle(sel.value);
    lsSet('agent.baseMap', sel.value);
  });

  if (window.RotaFeatures && RotaFeatures.redrawOtherAgents) RotaFeatures.redrawOtherAgents();
}

/* ---------------- init ---------------- */
(function init(){
  state.id = lsGet('agent.id', null);
  if (!state.id) { state.id = genAgentId(); lsSet('agent.id', state.id); }
  dlog('Agent ID: ' + state.id, 'i');

  document.getElementById('in-name').value    = lsGet('agent.name', '');
  document.getElementById('in-car').value     = lsGet('agent.car', '');
  document.getElementById('in-topic').value   = lsGet('agent.topic', '');
  document.getElementById('in-key').value     = lsGet('agent.key', '');
  document.getElementById('in-broker').value  = lsGet('agent.broker', 'auto');
  state.mapStyle = lsGet('agent.baseMap', 'positron');
  document.getElementById('in-map').value     = state.mapStyle;

  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then(function(r){
      if (r.state === 'granted') showScreen('scr-setup');
    }).catch(function(){});
  }

  document.getElementById('btn-perm').addEventListener('click', requestGpsPermission);
  document.getElementById('btn-start').addEventListener('click', startTracking);
  document.getElementById('btn-stop').addEventListener('click', stopTracking);
  document.getElementById('btn-locate').addEventListener('click', function(){
    if (state.map && state.lastLat != null) state.map.setView([state.lastLat, state.lastLng], 16);
  });
})();
</script>
