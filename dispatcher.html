<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  /* ============ SETUP ============ */
  #setup { position: fixed; inset: 0; background: #eef1f6; z-index: 5000;
           display: flex; align-items: center; justify-content: center; padding: 20px;
           overflow-y: auto; }
  #setup .box { background:#fff; padding: 28px; border-radius: 16px;
                box-shadow: 0 10px 40px rgba(0,0,0,.1); width: 100%; max-width: 460px; }
  #setup h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: 1px; }
  #setup .sub { font-size: 12px; color:#888; letter-spacing: 2px; margin-bottom: 20px; }
  #setup p  { margin: 0 0 20px; color:#666; font-size: 14px; line-height: 1.5; }
  #setup label { font-size: 13px; color:#666; display:block; margin-bottom: 6px; }
  #setup input, #setup select {
    width: 100%; padding: 14px; font-size: 16px; border: 1px solid #ddd;
    border-radius: 10px; background: #fafbfc; margin-bottom: 14px;
    -webkit-appearance: none; appearance: none;
  }
  #setup input:focus, #setup select:focus { outline:none; border-color:#1a1a1a; background:#fff; }
  #setup .btn-main { width: 100%; padding: 16px; font-size: 17px; font-weight: 600;

                     cursor:pointer; }
  #setup .btn-main:active { transform: scale(.98); }
  #setup .btn-main:disabled { background:#9aa; cursor: wait; }
  #setup .btn-diag { width: 100%; padding: 12px; margin-top: 10px; font-size: 14px;
                     font-weight: 500; border: 1px solid #ccc; border-radius: 10px;
                     background: #fff; color: #1a1a1a; cursor: pointer; }
  #setup .btn-diag:hover { background: #f3f4f6; }
  #setup .hint { margin-top: 14px; font-size: 12px; color:#888; line-height: 1.5; }
  #setup .adv { margin-top: 14px; font-size: 13px; color:#555; }
  #setup .adv summary { cursor: pointer; color:#1a1a1a; font-weight: 500; }

  /* ============ APP ============ */
  #app { display: none; height: 100vh; width: 100vw; }
  #app.visible { display: flex; }
  #map { flex: 1; background: #e5e7eb; }

  #sidebar { width: 360px; background:#fff; display:flex; flex-direction: column;
             border-left: 1px solid #e5e7eb; box-shadow: -4px 0 20px rgba(0,0,0,.05); z-index: 1000; }
  #sidebar header { padding: 12px 14px; border-bottom: 1px solid #eee;
                    display:flex; align-items:center; gap: 6px; flex-wrap: wrap; }
  #sidebar h2 { margin: 0; font-size: 15px; letter-spacing: 1px; flex: 1; min-width: 100px; }
  #conn { font-size: 11px; padding: 3px 8px; border-radius: 10px;
          background: #eee; color: #666; white-space: nowrap; }
  #conn.on  { background:#d4f5dd; color:#0a5c2e; }
  #conn.err { background:#ffe0e0; color:#900; }

  /* Кнопки в шапке: с текстом и иконкой */
  .btn-action {
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid #ddd; background:#fff; padding: 6px 10px;
    border-radius: 8px; cursor: pointer; font-size: 12px;
    font-family: inherit; color: #1a1a1a; white-space: nowrap;

  .btn-action.danger:hover { background: #fef2f2; }

  #list { overflow-y: auto; flex: 1; }
  .driver { padding: 12px 16px; border-bottom: 1px solid #f0f0f0;
            cursor: pointer; transition: background .15s; }
  .driver:hover { background:#f8fafc; }
  .driver .top { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .driver .name { font-weight:600; font-size:15px; flex:1; }

  #diagOverlay .head .count { font-size: 11px; color: #8b95a7; }

  #diagBody .warn { color: #ffd76e; }

    #toggle { position: fixed; bottom: 20px; right: 20px; z-index: 1100;

<body>

<div id="setup">

<!-- Диагностическая панель поверх всего -->

    <button id="diagCopy" type="button">Копировать</button>

  <div id="diagBody"></div>

<script>
// ============================================================
//  ЛОГ (пишет в overlay)
// ============================================================
const LOG = [];
function log(msg, kind) {
  const t = new Date().toLocaleTimeString('ru-RU');
  const line = `[${t}] ${msg}`;
  LOG.push({ line, kind });
  const body = document.getElementById('diagBody');
  const cnt  = document.getElementById('diagCount');
  if (body) {
    body.innerHTML = LOG.map(x =>
      `<span class="${x.kind||'info'}">${escapeHtml(x.line)}</span>`
    ).join('\n');
    body.scrollTop = body.scrollHeight;
  }
  if (cnt) cnt.textContent = LOG.length + ' строк';
  console.log('[dispatcher]', msg);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
//  Управление диагностической панелью
// ============================================================
function openDiag() {
  const el = document.getElementById('diagOverlay');
  if (el) el.classList.add('open');
  const fab = document.getElementById('diagFab');
  if (fab) fab.style.display = 'none';
}
function closeDiag() {
  const el = document.getElementById('diagOverlay');
  if (el) el.classList.remove('open');
  const fab = document.getElementById('diagFab');
  const app = document.getElementById('app');
  if (fab && app && app.classList.contains('visible')) fab.classList.add('visible');
}
function toggleDiag() {
  const el = document.getElementById('diagOverlay');
  if (!el) return;
  if (el.classList.contains('open')) closeDiag(); else openDiag();
}

document.getElementById('diagToggle').addEventListener('click', toggleDiag);
document.getElementById('diagToggle2').addEventListener('click', toggleDiag);
document.getElementById('diagFab').addEventListener('click', toggleDiag);
document.getElementById('diagClose').addEventListener('click', closeDiag);
document.getElementById('diagClear').addEventListener('click', () => {
  LOG.length = 0;
  document.getElementById('diagBody').innerHTML = '';
  document.getElementById('diagCount').textContent = '0 строк';
});
document.getElementById('diagCopy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(LOG.map(x => x.line).join('\n'));
    const btn = document.getElementById('diagCopy');
    btn.textContent = '✅ Скопировано';
    setTimeout(() => { btn.textContent = 'Копировать'; }, 1500);
  } catch (e) {
    alert('Не удалось скопировать');
  }
});

// ============================================================
//  CDN-загрузчики
// ============================================================
function loadScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = resolve;
    s.onerror = () => reject(new Error('fail ' + url));
    document.head.appendChild(s);
  });
}
function loadScriptAny(urls) {
  let p = Promise.reject();
  urls.forEach(u => { p = p.catch(() => loadScript(u)); });
  return p;
}
const MQTT_CDNS = [
  'https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.5/mqtt.min.js',
  'https://cdn.jsdelivr.net/npm/mqtt@5.3.5/dist/mqtt.min.js',
  'https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js'
];
const LEAFLET_CDNS = [
  'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',
  'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
  'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'
];

// ============================================================
//  Базовые карты

const BASE_MAPS = {

// ============================================================
//  КРИПТО
// ============================================================
function b64urlToBytes(s) {
  const b64 = s.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function deriveRoomHash(groupCode, groupKey) {
  const data = new TextEncoder().encode(groupCode + ':' + groupKey + ':v1');
  const hash = await crypto.subtle.digest('SHA-256', data);
  const hex  = [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2, '0')).join('');
  return hex.slice(0, 24);
}
async function deriveCryptoKey(groupCode, groupKey) {
  const base = await crypto.subtle.importKey(
    'raw',
    new TextEncoder().encode(groupCode + ':' + groupKey + ':enc'),
    { name: 'PBKDF2' }, false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: new TextEncoder().encode('rotacol-salt-v1'),
      iterations: 100000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
}
async function decryptPayload(key, b64url) {
  const raw = b64urlToBytes(b64url);
  const iv  = raw.slice(0, 12);
  const ct  = raw.slice(12);
  const pt  = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

// ============================================================
//  ОСНОВНАЯ ЛОГИКА
// ============================================================
(function () {
  const OFFLINE_AFTER = 90000;
  const TOPIC_PREFIX  = 'rotacol-v1';
  const LS_BASEMAP    = 'disp.baseMap';

  const $ = id => document.getElementById(id);
  const setupEl   = $('setup');
  const appEl     = $('app');
  const topicEl   = $('topic');
  const groupKeyEl= $('groupkey');
  const brokerEl  = $('broker');
  const baseMapSel   = $('baseMap');
  const baseMapFloat = $('baseMapFloat');
  const connEl    = $('conn');
  const listEl    = $('list');
  const sidebar   = $('sidebar');
  const connectBtn = $('connect');
  const diagFab   = $('diagFab');

  let map = null;
  let currentBaseLayer = null;
  let currentBaseKey = 'positron';
  let client = null;
  let cryptoKey = null;
  let baseTopic = '';
  let didInitialCenter = false;

  const drivers = new Map();

  // Логирование окружения
  log('=== ДИАГНОСТИКА ОКРУЖЕНИЯ ===', 'info');
  log('URL: ' + location.href.slice(0, 120), 'info');
  log('Протокол: ' + location.protocol, location.protocol === 'https:' ? 'ok' : 'warn');
  log('Secure context: ' + (window.isSecureContext ? 'ДА' : 'НЕТ'),
      window.isSecureContext ? 'ok' : 'fail');
  log('crypto.subtle: ' + (window.crypto && crypto.subtle ? 'есть' : 'НЕТ'),
      (window.crypto && crypto.subtle) ? 'ok' : 'fail');

  // Предзаполнение
  try {
    topicEl.value    = localStorage.getItem('disp.topic') || '';
    groupKeyEl.value = localStorage.getItem('disp.key')   || '';
    brokerEl.value   = localStorage.getItem('disp.broker')|| 'auto';
  } catch {}
  try {
    const savedBase = localStorage.getItem(LS_BASEMAP);
    if (savedBase && BASE_MAPS[savedBase]) {
      currentBaseKey = savedBase;
      baseMapSel.value   = savedBase;
      baseMapFloat.value = savedBase;
    }
  } catch {}

  // --------- Утилиты ---------
  function humanAgo(ts) {
    const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 5)     return 'только что';
    if (s < 60)    return s + ' сек назад';
    if (s < 3600)  return Math.round(s / 60) + ' мин назад';
    if (s < 86400) return Math.round(s / 3600) + ' ч назад';
    return new Date(ts).toLocaleString('ru-RU');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function sanitize(s) {
    return String(s || '').trim().replace(/[^a-zA-Z0-9_\-]/g, '-').slice(0, 64);
  }

  // --------- Карта ---------
  function setBaseLayer(key) {
    if (!map) return;
    if (!BASE_MAPS[key]) key = 'positron';
    if (currentBaseLayer) map.removeLayer(currentBaseLayer);
    currentBaseLayer = BASE_MAPS[key].make();
    currentBaseLayer.addTo(map);
    currentBaseKey = key;
    baseMapSel.value   = key;
    baseMapFloat.value = key;
    try { localStorage.setItem(LS_BASEMAP, key); } catch {}
  }

  function initMap() {
    if (map) return;
    map = L.map('map', { zoomControl: true, layers: [] })
          .setView([55.751244, 37.618423], 10);
    setBaseLayer(currentBaseKey);

    const leafletBase = {};
    Object.keys(BASE_MAPS).forEach(k => {
      leafletBase[BASE_MAPS[k].name] = BASE_MAPS[k].make();
    });
    L.control.layers(leafletBase, null,
      { position: 'topleft', collapsed: true }).addTo(map);

    map.on('baselayerchange', (e) => {
      const key = Object.keys(BASE_MAPS).find(k => BASE_MAPS[k].name === e.name);
      if (key && key !== currentBaseKey) {
        if (currentBaseLayer) map.removeLayer(currentBaseLayer);
        if (leafletBase[e.name]) map.removeLayer(leafletBase[e.name]);
        currentBaseLayer = BASE_MAPS[key].make();
        currentBaseLayer.addTo(map);
        currentBaseKey = key;
        baseMapSel.value    = key;
        baseMapFloat.value  = key;
        try { localStorage.setItem(LS_BASEMAP, key); } catch {}
      }
    });
  }

  function makeIcon(online) {
    const color = online ? '#22c55e' : '#9ca3af';
    const glow  = online ? ',0 0 12px rgba(34,197,94,.85)' : '';
    return L.divIcon({
      className: '',
      html: `<div style="width:20px;height:20px;border-radius:50%;
                background:${color};border:3px solid #fff;
                box-shadow:0 0 6px rgba(0,0,0,.55)${glow};"></div>`,
      iconSize:[20,20], iconAnchor:[10,10], popupAnchor:[0,-12]
    });
  }

  function labelHtml(d) {
    const time = new Date(d.lastSeen).toLocaleTimeString('ru-RU',
      { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const ago = humanAgo(d.lastSeen)
      .replace(' секунд назад',' с').replace(' сек назад',' с')
      .replace(' минут назад',' мин').replace(' мин назад',' мин')
      .replace(' час назад',' ч').replace(' часа назад',' ч')
      .replace(' часов назад',' ч').replace('только что','сейчас');
    return `<span>${esc(d.name || 'Агент')}</span>` +
           `<span class="label-time">${time} · ${ago}</span>`;
  }

  function applyLabel(entry) {
    const d = entry.data;
    if (!entry.marker) return;
    const cls  = 'driver-label ' + (d.online ? 'is-online' : 'is-offline');
    const html = labelHtml(d);

    if (!entry.marker.getTooltip()) {
      entry.marker.bindTooltip(html, {
        permanent: true, direction: 'bottom', offset: [0, 10],
        className: cls, opacity: 1
      });
      entry.marker.getTooltip().on('click', () => openDriver(d.id));
    } else {
      const tip = entry.marker.getTooltip();
      tip.setContent(html);
      if (tip._container) {
        tip._container.className =
          'leaflet-tooltip ' + cls + ' leaflet-zoom-animated';
      }
    }
  }

  function popupHtml(d) {
    const status = d.online
      ? '<span style="color:#0a5c2e">🟢 онлайн</span>'
      : '<span style="color:#888">⚪ офлайн</span>';
    const gmap = `https://www.google.com/maps?q=${d.lat},${d.lng}`;
    const time = new Date(d.lastSeen).toLocaleTimeString('ru-RU');
    return `
      <div style="font-size:13px;line-height:1.55;min-width:180px">
        <b>${esc(d.name || 'Агент')}</b><br>
        ${d.car ? esc(d.car) + '<br>' : ''}
        ${status}<br>
        <span style="font-family:ui-monospace,monospace;font-size:12px">
          ${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}
        </span><br>
        <small style="color:#888">Обновлено в ${time} (${humanAgo(d.lastSeen)})</small><br>
        <a href="${gmap}" target="_blank" rel="noopener">Открыть в Google Maps →</a>
      </div>`;
  }

  function upsertMarker(entry) {
    const d = entry.data;
    if (d.lat == null || d.lng == null) return;
    const ll = [d.lat, d.lng];

    if (!entry.marker) {
      entry.marker = L.marker(ll, { icon: makeIcon(d.online) }).addTo(map);
      entry.marker.on('click', () => openDriver(d.id));
    } else {
      entry.marker.setLatLng(ll);
      entry.marker.setIcon(makeIcon(d.online));
    }
    entry.marker.bindPopup(popupHtml(d));
    applyLabel(entry);

    if (!didInitialCenter) {
      map.setView(ll, 13);
      didInitialCenter = true;
    }
  }

  function renderPanel() {
    const arr = [...drivers.values()].sort((a,b) => {
      if (a.data.online !== b.data.online) return a.data.online ? -1 : 1;
      return b.data.lastSeen - a.data.lastSeen;
    });

    if (!arr.length) {
      listEl.innerHTML =
        '<div id="empty">Пока никто не передаёт координаты.<br><br>' +
        'Агент должен ввести тот же код и ключ группы и нажать «▶ Начать передачу».</div>';
      return;
    }

    listEl.innerHTML = arr.map(e => {
      const d = e.data;
      const gmap = `https://www.google.com/maps?q=${d.lat},${d.lng}`;
      const time = new Date(d.lastSeen).toLocaleTimeString('ru-RU');
      return `
        <div class="driver ${d.online ? 'on' : ''}" data-id="${esc(d.id)}">
          <div class="top">
            <span class="dot"></span>
            <span class="name">${esc(d.name || 'Агент')}</span>
          </div>
          ${d.car ? `<div class="meta">🚗 ${esc(d.car)}</div>` : ''}
          <div class="coord">${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}</div>
          <div class="ago">${d.online ? 'онлайн' : 'офлайн'} · ${time} · ${humanAgo(d.lastSeen)}</div>
          <a class="gmap" href="${gmap}" target="_blank" rel="noopener"
             onclick="event.stopPropagation()">Google Maps →</a>
        </div>`;
    }).join('');
  }

  function openDriver(id) {
    const e = drivers.get(id);
    if (!e || !e.marker) return;
    map.setView(e.marker.getLatLng(), 15);
    e.marker.openPopup();
    if (window.innerWidth < 768) sidebar.classList.remove('open');
  }

  listEl.addEventListener('click', ev => {
    const row = ev.target.closest('.driver');
    if (row) openDriver(row.dataset.id);
  });

  async function handleMessage(msg) {
    let p;
    try {
      const packed = new TextDecoder().decode(msg.payload);
      if (!packed) return;
      p = await decryptPayload(cryptoKey, packed);
    } catch (e) {
      return; // чужое или нерасшифровываемое
    }
    if (!p || !p.id) return;

    log('📨 Расшифровано: ' + (p.name||p.id) +
        (p.lat != null ? ' ' + p.lat.toFixed(5) + ',' + p.lng.toFixed(5) : ''),
        'ok');

    const driverId = p.id;
    let entry = drivers.get(driverId);
    if (!entry) {
      entry = { data: { id: driverId }, marker: null };
      drivers.set(driverId, entry);
    }
    const d = entry.data;

    const ts = p.ts && Math.abs(p.ts - Date.now()) < 6e5 ? p.ts : Date.now();

    if (p.event === 'offline' || p.event === 'stop') {
      d.online = false;
      d.lastSeen = ts;
    } else {
      if (p.lat      != null) d.lat      = p.lat;
      if (p.lng      != null) d.lng      = p.lng;
      if (p.accuracy != null) d.accuracy = p.accuracy;
      if (p.speed    != null) d.speed    = p.speed;
      if (p.heading  != null) d.heading  = p.heading;
      if (p.name)             d.name     = p.name;
      if (p.car      != null) d.car      = p.car;
      d.lastSeen = ts;
      d.online   = (Date.now() - d.lastSeen) < OFFLINE_AFTER;
    }

    if (d.lat != null) upsertMarker(entry);
    renderPanel();
  }

  function setConn(cls, text) {
    connEl.className = cls;
    connEl.textContent = text;
  }

  setInterval(() => {
    if (!baseTopic) return;
    const now = Date.now();
    for (const e of drivers.values()) {
      const shouldBeOnline = (now - e.data.lastSeen) < OFFLINE_AFTER;
      if (e.data.online !== shouldBeOnline) {
        e.data.online = shouldBeOnline;
        if (e.marker) {
          e.marker.setIcon(makeIcon(e.data.online));
          e.marker.setPopupContent(popupHtml(e.data));
        }
      }
      applyLabel(e);
    }
    renderPanel();
  }, 5000);

  // --------- Кнопки ---------
  $('fit').addEventListener('click', () => {
    const pts = [...drivers.values()]
      .filter(e => e.data.lat != null)
      .map(e => [e.data.lat, e.data.lng]);
    if (!pts.length) {
      log('Нет агентов с координатами — нечего показывать.', 'warn');
      return;
    }
    map.fitBounds(L.latLngBounds(pts).pad(0.2));
  });

  $('change').addEventListener('click', () => {
    log('Смена группы: отключаюсь от текущей…', 'info');
    try {
      if (client) { try { client.end(true); } catch {} client = null; }
      baseTopic = '';
      cryptoKey = null;
      drivers.clear();
      if (map) { map.remove(); map = null; currentBaseLayer = null; }
      diagFab.classList.remove('visible');
      appEl.classList.remove('visible');
      setupEl.style.display = 'flex';
      didInitialCenter = false;
      connectBtn.disabled = false;
      connectBtn.textContent = 'Подключиться';
      setConn('', '…');
      topicEl.focus();
      log('✅ Готово к вводу новой группы.', 'ok');
    } catch (e) {
      log('❌ Ошибка при смене группы: ' + e.message, 'fail');
      alert('Не удалось переключить группу: ' + e.message);
    }
  });

  $('toggle').addEventListener('click', () => sidebar.classList.toggle('open'));
  $('close').addEventListener('click',  () => sidebar.classList.remove('open'));

  baseMapSel.addEventListener('change',   () => setBaseLayer(baseMapSel.value));
  baseMapFloat.addEventListener('change', () => setBaseLayer(baseMapFloat.value));

  connectBtn.addEventListener('click', connect);
  topicEl.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
  groupKeyEl.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

  // --------- MQTT ---------
  function tryBroker(url, label) {
    return new Promise((resolve, reject) => {
      log('Подключаюсь к ' + label + '…', 'info');
      const c = mqtt.connect(url, {
        clientId: 'n-' + Math.random().toString(16).slice(2, 10),
        clean: true, keepalive: 30, reconnectPeriod: 3000, connectTimeout: 10000
      });
      let resolved = false;
      const timeout = setTimeout(() => {
        if (!resolved) {
          resolved = true;
          log('❌ Тайм-аут к ' + label, 'fail');
          try { c.end(true); } catch {}
          reject(new Error('timeout ' + label));
        }
      }, 11000);

      c.on('connect', () => {
        clearTimeout(timeout);
        log('✅ Подключено к ' + label, 'ok');
        if (!resolved) { resolved = true; resolve(c); }
      });
      c.on('error', (err) => {
        log('⚠️ ' + label + ': ' + (err.message || err), 'warn');
        if (!resolved) {
          clearTimeout(timeout);
          resolved = true;
          try { c.end(true); } catch {}
          reject(err);
        }
      });
    });
  }

  async function connectAnyBroker() {
    let list;
    const manual = brokerEl.value;
    if (manual && manual !== 'auto') {
      list = [['wss://' + manual, manual]];
    } else {
      list = [
        ['wss://broker.emqx.io:8084/mqtt',     'broker.emqx.io'],
        ['wss://broker.hivemq.com:8884/mqtt',  'broker.hivemq.com'],
        ['wss://test.mosquitto.org:8081/mqtt', 'test.mosquitto.org']
      ];
    }
    let lastErr = null;
    for (const [url, label] of list) {
      try { return await tryBroker(url, label); }
      catch (e) { lastErr = e; log('Пробую следующий…', 'info'); }
    }
    throw lastErr || new Error('no broker');
  }

  // ============================================================
  //  ПОДКЛЮЧЕНИЕ
  // ============================================================
  async function connect() {
    const code = sanitize(topicEl.value);
    const key  = groupKeyEl.value.trim();

    if (!code) { topicEl.focus(); topicEl.style.borderColor = '#dc3545'; return; }
    if (!key)  { groupKeyEl.focus(); groupKeyEl.style.borderColor = '#dc3545'; return; }

    if (!window.crypto || !crypto.subtle) {
      alert('Криптография недоступна. Откройте страницу по HTTPS.');
      return;
    }

    connectBtn.disabled = true;
    connectBtn.textContent = 'Крипто-подготовка…';

    currentBaseKey = baseMapSel.value || 'positron';
    try { localStorage.setItem(LS_BASEMAP, currentBaseKey); } catch {}

    log('=== ПОДКЛЮЧЕНИЕ ===', 'info');

    try {
      await Promise.all([loadScriptAny(MQTT_CDNS), loadScriptAny(LEAFLET_CDNS)]);
      log('✅ Библиотеки загружены', 'ok');
    } catch (e) {
      log('❌ Не удалось загрузить библиотеки с CDN', 'fail');
      alert('Не удалось загрузить библиотеки с CDN.');
      connectBtn.disabled = false;
      connectBtn.textContent = 'Подключиться';
      return;
    }

    try {
      localStorage.setItem('disp.topic',  topicEl.value.trim());
      localStorage.setItem('disp.key',    key);
      localStorage.setItem('disp.broker', brokerEl.value);
    } catch {}

    try {
      const roomHash = await deriveRoomHash(code, key);
      cryptoKey      = await deriveCryptoKey(code, key);
      baseTopic      = TOPIC_PREFIX + '/' + roomHash;
      log('✅ Хеш группы: ' + roomHash, 'ok');
      log('Подписка будет на: ' + baseTopic + '/+', 'info');
    } catch (e) {
      log('❌ Крипто-ошибка: ' + e.message, 'fail');
      alert('Ошибка криптографии: ' + e.message);
      connectBtn.disabled = false;
      connectBtn.textContent = 'Подключиться';
      return;
    }

    setupEl.style.display = 'none';
    appEl.classList.add('visible');
    diagFab.classList.add('visible');

    await new Promise(r => setTimeout(r, 50));
    initMap();
    map.invalidateSize();

    drivers.clear();
    didInitialCenter = false;
    renderPanel();

    connectBtn.textContent = 'Подключиться';
    connectBtn.disabled = false;

    setConn('', 'подключение…');

    try {
      client = await connectAnyBroker();
      log('✅ Соединение установлено', 'ok');
    } catch (e) {
      log('❌ Все брокеры недоступны: ' + e.message, 'fail');
      setConn('err', 'нет связи');
      alert('Не удалось подключиться к серверу связи.');
      return;
    }

    setConn('on', 'онлайн');

    // === КЛЮЧЕВОЕ: подписка СРАЗУ, соединение уже установлено
    client.subscribe(baseTopic + '/+', { qos: 1 }, (err) => {
      if (err) {
        log('❌ Ошибка подписки: ' + err.message, 'fail');
        setConn('err', 'ошибка подписки');
      } else {
        log('✅ Подписка оформлена на ' + baseTopic + '/+', 'ok');
        log('Ждём сообщения от агентов…', 'info');
      }
    });

    // На случай реконнекта
    client.on('connect', () => {
      setConn('on', 'онлайн');
      log('🔁 MQTT переподключился, восстанавливаю подписку', 'warn');
      client.subscribe(baseTopic + '/+', { qos: 1 });
    });

    client.on('message', (topic, payload) => {
      log('📥 MQTT пришло на ' + topic + ' (' + payload.length + ' байт)', 'info');
      handleMessage({ topic, payload });
    });

    client.on('reconnect', () => { setConn('', 'переподключение…'); });
    client.on('close',     () => { setConn('err', 'нет связи'); log('MQTT: соединение закрыто', 'warn'); });
    client.on('error',     (e) => { setConn('err', 'ошибка'); log('MQTT error: ' + (e.message||e), 'fail'); });
  }
})();
</script>
</body>
</html>
