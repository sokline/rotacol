<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: #0b1220; color: #e5e7eb;
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

/* ---- Экран логина ---- */
#login {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: #0b1220; padding: 16px;
}
#login.hidden { display: none; }
#login .card {
  background: #111827; border-radius: 16px; padding: 22px;
  max-width: 420px; width: 100%; box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
#login h1 { font-size: 20px; margin: 0 0 4px; }
#login .sub { opacity: .6; font-size: 13px; margin-bottom: 18px; }
#login label.f { display: block; margin-bottom: 12px; }
#login label.f span { display: block; font-size: 12px; opacity: .7; margin-bottom: 5px; }
#login input, #login select {
  width: 100%; padding: 11px 12px; border-radius: 10px;
  border: 1px solid #374151; background: #0b1220; color: #e5e7eb;
  font: 15px/1.2 inherit; outline: none;
}
#login button.big {
  display: block; width: 100%; border: 0; border-radius: 12px;
  padding: 15px 18px; font: 700 16px/1 inherit; cursor: pointer;
  background: linear-gradient(135deg,#1f6feb,#0ea5e9); color: #fff; margin-top: 8px;
}

/* ---- Основной layout ---- */
#app { display: none; height: 100dvh; }
#app.on { display: flex; flex-direction: column; }

#header {
  display: flex; align-items: center; gap: 6px;
  padding: calc(8px + env(safe-area-inset-top,0px)) 10px 8px;
  background: #0b1220; border-bottom: 1px solid #1f2937;
  flex: 0 0 auto; overflow-x: auto;
}
#header .title {
  font-weight: 700; font-size: 14px; white-space: nowrap;
  margin-right: auto; letter-spacing: .3px;
}
#header .hbtn {
  border: 1px solid #374151; background: #111827; color: #e5e7eb;
  border-radius: 9px; padding: 8px 12px; font: 600 13px/1 inherit;
  cursor: pointer; white-space: nowrap; flex: 0 0 auto;
}
#header .hbtn:hover { background: #1f2937; }
#header .hbtn.green { background:#065f46; border-color:#10b981; color:#6ee7b7; }
#header .hbtn.red   { background:#7f1d1d; border-color:#dc2626; color:#fecaca; }

#main { flex: 1 1 auto; display: flex; position: relative; min-height: 0; }
#map { flex: 1 1 auto; background: #0f172a; }

/* ---- Sidebar ---- */
#sidebar {
  width: 340px; flex: 0 0 340px; background: #0b1220;
  border-left: 1px solid #1f2937; overflow-y: auto;
  transition: transform .25s ease;
}
#sidebar .agent-row {
  padding: 12px 14px; border-bottom: 1px solid #1f2937; cursor: pointer;
}
#sidebar .agent-row:hover { background: #111827; }
#sidebar .agent-row .nm { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
#sidebar .agent-row .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
#sidebar .agent-row .dot.on { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
#sidebar .agent-row .dot.off { background: #6b7280; }
#sidebar .agent-row .cr { font-size: 12px; opacity: .7; margin-top: 2px; }
#sidebar .agent-row .co { font: 500 12px/1.3 ui-monospace, monospace; opacity: .8; margin-top: 3px; }
#sidebar .agent-row .mt { font-size: 11px; opacity: .55; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
#sidebar .agent-row .mt a { color: #60a5fa; text-decoration: none; }
#sidebar .empty { padding: 40px 20px; text-align: center; opacity: .5; font-size: 13px; }

/* ---- Leaflet маркеры и тултипы ---- */
.agent-marker { position: relative; }
.agent-marker .pin {
  width: 18px; height: 18px; border-radius: 50%;
  background: #22c55e; border: 3px solid #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.5);
}
.agent-marker.off .pin { background: #6b7280; }
.agent-marker .pulse {
  position: absolute; left: 50%; top: 50%;
  width: 18px; height: 18px; margin: -9px 0 0 -9px;
  border-radius: 50%; background: #22c55e; opacity: .5;
  animation: pulse 1.8s ease-out infinite;
  pointer-events: none;
}
@keyframes pulse {
  0%   { transform: scale(1);   opacity: .55; }
  100% { transform: scale(2.8); opacity: 0; }
}
.leaflet-tooltip.agent-label {
  background: rgba(17,24,39,.92); color: #e5e7eb; border: 1px solid #374151;
  font: 600 12px/1.2 -apple-system, sans-serif; padding: 5px 9px; border-radius: 8px;
  box-shadow: 0 3px 10px rgba(0,0,0,.5);
}
.leaflet-tooltip.agent-label::before { display: none; }
.leaflet-popup-content-wrapper { background: #111827; color: #e5e7eb; border-radius: 12px; }
.leaflet-popup-content { margin: 12px 14px; font-size: 13px; }
.leaflet-popup-tip { background: #111827; }
.leaflet-popup-content a { color: #60a5fa; }
.leaflet-popup-content b { color: #fff; }

/* ---- Плавающие элементы управления ---- */
.float-sel {
  position: absolute; top: 10px; right: 10px; z-index: 800;
  background: #111827; color: #e5e7eb; border: 1px solid #374151;
  border-radius: 9px; padding: 7px 10px; font: 600 12px/1 inherit; cursor: pointer;
}

/* ---- Мобильный режим ---- */
@media (max-width: 820px) {
  #sidebar {
    position: absolute; right: 0; top: 0; bottom: 0;
    width: 86%; max-width: 360px; z-index: 1000;
    transform: translateX(100%);
    box-shadow: -8px 0 30px rgba(0,0,0,.5);
  }
  #sidebar.open { transform: translateX(0); }
}

/* ---- Дамми-модалка с диагностикой ---- */
.modal {
  position: fixed; inset: 0; z-index: 999998;
  background: rgba(0,0,0,.55); display: flex; align-items: flex-end;
}
.modal.hidden { display: none; }
.modal .sheet {
  width: 100%; max-height: 70vh; background: #0b1220;
  border-radius: 16px 16px 0 0; padding: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom,0px));
  display: flex; flex-direction: column;
}
.modal .head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.modal .head h3 { margin: 0; flex: 1; font-size: 15px; }
.modal .head button {
  border: 0; border-radius: 8px; padding: 8px 12px;
  font: 600 13px/1 inherit; cursor: pointer; background: #1f2937; color: #e5e7eb;
}
.modal .log {
  flex: 1 1 auto; overflow: auto; background: #050b15;
  border: 1px solid #1f2937; border-radius: 10px;
  padding: 10px; font: 11px/1.4 ui-monospace, monospace;
  white-space: pre-wrap; word-break: break-word;
}
.modal .log .e { color: #fca5a5; }
.modal .log .w { color: #fcd34d; }
.modal .log .i { color: #93c5fd; }

.fab {
  position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom,0px));
  z-index: 900; width: 46px; height: 46px; border-radius: 50%;
  background: #1f2937; color: #e5e7eb; border: 1px solid #374151;
  font-size: 20px; cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.4);
}
.fab.hidden { display: none; }
</style>

<!-- MQTT.js + Leaflet -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.3.5/mqtt.min.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/mqtt@5.3.5/dist/mqtt.min.js';document.head.appendChild(s)"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';document.head.appendChild(s)"></script>

<script>
/* =====================================================================
   DISPATCHER — RotaCol
   ===================================================================== */
'use strict';

/* ---------------- лог ---------------- */
var logBody = null;
function dlog(msg, cls){
  var line = '[' + new Date().toLocaleTimeString('ru-RU') + '] ' + msg;
  if (!logBody) logBody = document.getElementById('log-body');
  if (logBody){
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = line;
    logBody.appendChild(d);
    while (logBody.children.length > 500) logBody.removeChild(logBody.firstChild);
    logBody.scrollTop = logBody.scrollHeight;
  }
  console.log('[disp]', msg);
}

/* ---------------- состояние ---------------- */
var state = {
  topic: '', key: '', broker: 'auto', mapStyle: 'positron',
  topicPrefix: null, cryptoKey: null,
  client: null, connected: false,
  map: null, tileLayer: null,
  agents: {},            // id -> { id, name, car, lat, lng, acc, spd, lastSeen, marker, tooltip, online }
  tickTimer: null
};

/* ---------------- utils ---------------- */
function lsGet(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : v; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
function sanitize(s){ return String(s||'').replace(/[^a-zA-Z0-9_\-]/g,'').slice(0,64); }
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function b64u(bytes){
  var s = btoa(String.fromCharCode.apply(null, bytes));
  return s.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64u(str){
  str = String(str).replace(/-/g,'+').replace(/_/g,'/');
  while (str.length % 4) str += '=';
  var bin = atob(str);
  var arr = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
function humanAgo(ts){
  if (!ts) return '—';
  var d = Math.max(0, Math.floor((Date.now()-ts)/1000));
  if (d < 60) return d + ' с назад';
  if (d < 3600) return Math.floor(d/60) + ' мин назад';
  if (d < 86400) return Math.floor(d/3600) + ' ч назад';
  return Math.floor(d/86400) + ' дн назад';
}
function fmtTime(ts){ try { return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); } catch(e){ return ''; } }

/* ---------------- крипто ---------------- */
async function deriveTopicHash(code, key){
  var data = new TextEncoder().encode(code + ':' + key + ':v1');
  var buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('').slice(0,24);
}
async function deriveAesKey(code, key){
  var raw = new TextEncoder().encode(code + ':' + key + ':v1');
  var baseKey = await crypto.subtle.importKey('raw', raw, { name:'PBKDF2' }, false, ['deriveKey']);
  var salt = new TextEncoder().encode('rotacol-salt-v1');
  return await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: salt, iterations: 100000, hash:'SHA-256' },
    baseKey, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
async function encryptPayload(obj){
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var data = new TextEncoder().encode(JSON.stringify(obj));
  var ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv: iv }, state.cryptoKey, data);
  var out = new Uint8Array(iv.length + ct.byteLength);
  out.set(iv, 0); out.set(new Uint8Array(ct), iv.length);
  return b64u(out);
}
async function decryptPayload(payload){
  // MQTT.js отдаёт payload как Buffer/Uint8Array.
  // Если publish был строкой — внутри лежат UTF-8 байты base64url-строки.
  // Сначала приводим к строке, потом декодируем base64url.
  var str;
  if (typeof payload === 'string') {
    str = payload;
  } else if (payload instanceof Uint8Array) {
    str = new TextDecoder('utf-8').decode(payload);
  } else {
    str = String(payload);
  }
  var raw = unb64u(str);
  if (raw.length < 13) throw new Error('короткий payload (' + raw.length + ' байт)');
  var iv = raw.slice(0,12);
  var ct = raw.slice(12);
  var pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, state.cryptoKey, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------------- брокеры ---------------- */
var BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt'
];
function brokerList(){
  if (state.broker && state.broker !== 'auto') return [state.broker];
  return BROKERS.slice();
}
function tryConnect(url){
  return new Promise(function(resolve, reject){
    var c = mqtt.connect(url, {
      clientId: 'disp-' + Math.random().toString(36).slice(2,10),
      clean: true,
      reconnectPeriod: 5000,
      connectTimeout: 8000,
      keepalive: 30
    });
    var to = setTimeout(function(){ try { c.end(true); } catch(e){} reject(new Error('таймаут')); }, 9000);
    c.once('connect', function(){ clearTimeout(to); resolve({ client: c, url: url }); });
    c.once('error', function(err){ clearTimeout(to); try { c.end(true); } catch(e){} reject(err); });
  });
}
async function connectAnyBroker(){
  var list = brokerList();
  for (var i=0;i<list.length;i++){
    try {
      dlog('Попытка: ' + list[i], 'i');
      var r = await tryConnect(list[i]);
      dlog('✅ Подключено: ' + r.url, 'i');
      return r.client;
    } catch (e) {
      dlog('✗ ' + list[i] + ' — ' + (e.message || e), 'w');
    }
  }
  throw new Error('Все брокеры недоступны');
}

/* ---------------- стили карт ---------------- */
var TILES = {
  'positron':    { url:'https://tiles.openfreemap.org/styles/positron/{z}/{x}/{y}.png', attr:'© OpenFreeMap', max:19 },
  'osm-hot':     { url:'https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', attr:'© OSM HOT', max:19 },
  'osm-de':      { url:'https://tile.openstreetmap.de/{z}/{x}/{y}.png', attr:'© OSM DE', max:19 },
  'esri-street': { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attr:'© Esri', max:19 },
  'topo':        { url:'https://a.tile.opentopomap.org/{z}/{x}/{y}.png', attr:'© OpenTopoMap', max:17 },
  'sat':         { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attr:'© Esri', max:19 }
};
function applyTileStyle(which){
  var t = TILES[which] || TILES.positron;
  if (state.tileLayer) state.map.removeLayer(state.tileLayer);
  state.tileLayer = L.tileLayer(t.url, { maxZoom: t.max, attribution: t.attr }).addTo(state.map);
  state.mapStyle = which;
  lsSet('disp.baseMap', which);
  var sel = document.getElementById('map-style-live');
  if (sel) sel.value = which;
}

/* ---------------- карта ---------------- */
function initMap(){
  state.map = L.map('map', { zoomControl: true }).setView([55.75, 37.62], 5);
  applyTileStyle(state.mapStyle);

  var sel = document.getElementById('map-style-live');
  Object.keys(TILES).forEach(function(k){
    var o = document.createElement('option'); o.value = k; o.textContent = k;
    if (k === state.mapStyle) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', function(){ applyTileStyle(sel.value); });
  L.control.layers(null, null, { position: 'topleft' }).addTo(state.map);
}

/* ---------------- маркеры агентов ---------------- */
var ONLINE_MS = 90000;

function ensureAgent(id, data){
  var a = state.agents[id];
  if (!a){
    a = state.agents[id] = {
      id: id, name: '', car: '', lat: null, lng: null,
      acc: null, spd: null, lastSeen: 0, online: false,
      marker: null, tooltip: null
    };
  }
  if (data){
    if (data.name) a.name = data.name;
    if (data.car != null) a.car = data.car;
    if (data.lat != null) a.lat = data.lat;
    if (data.lng != null) a.lng = data.lng;
    if (data.acc != null) a.acc = data.acc;
    if (data.spd != null) a.spd = data.spd;
    a.lastSeen = Date.now();
    a.online = true;
  }
  return a;
}

function upsertMarker(a){
  if (a.lat == null || a.lng == null) return;
  var ll = [a.lat, a.lng];

  if (!a.marker){
    var html = '<div class="agent-marker on"><div class="pin"></div><div class="pulse"></div></div>';
    var icon = L.divIcon({
      html: html, className: '', iconSize: [18,18], iconAnchor: [9,9]
    });
    a.marker = L.marker(ll, { icon: icon }).addTo(state.map);
    a.tooltip = L.tooltip({
      permanent: true, direction: 'bottom', offset: [0, 6],
      className: 'agent-label', interactive: false
    });
    a.marker.bindTooltip(a.tooltip);
    a.marker.bindPopup(buildPopup(a), { offset: [0, -8] });
    a.marker.on('popupopen', function(){ a.marker.setPopupContent(buildPopup(a)); });
  } else {
    a.marker.setLatLng(ll);
  }

  // tooltip текст
  var ago = humanAgo(a.lastSeen);
  a.marker.getTooltip().setContent(
    '<b>' + escHtml(a.name || a.id) + '</b><br>' +
    fmtTime(a.lastSeen) + ' · ' + ago
  );

  // класс online/offline на иконке
  var wrap = a.marker.getElement();
  if (wrap){
    var inner = wrap.querySelector('.agent-marker');
    if (inner){
      inner.classList.toggle('off', !a.online);
      inner.classList.toggle('on',  a.online);
    }
  }
}

function buildPopup(a){
  var gmaps = 'https://www.google.com/maps?q=' + a.lat + ',' + a.lng;
  var spd = a.spd != null && a.spd >= 0 ? (a.spd * 3.6).toFixed(1) + ' км/ч' : '—';
  return '<div style="min-width:190px">' +
    '<div style="font-weight:700;font-size:14px;margin-bottom:6px">' + escHtml(a.name || a.id) + '</div>' +
    (a.car ? '<div style="opacity:.8">🚗 ' + escHtml(a.car) + '</div>' : '') +
    '<div style="opacity:.8">Статус: <b style="color:' + (a.online ? '#22c55e' : '#9ca3af') + '">' +
      (a.online ? 'онлайн' : 'офлайн') + '</b></div>' +
    '<div style="opacity:.8">' + a.lat.toFixed(6) + ', ' + a.lng.toFixed(6) + '</div>' +
    '<div style="opacity:.8">Точность: ±' + Math.round(a.acc||0) + ' м · ' + spd + '</div>' +
    '<div style="opacity:.8;margin-top:4px">' + fmtTime(a.lastSeen) + ' · ' + humanAgo(a.lastSeen) + '</div>' +
    '<div style="margin-top:8px"><a href="' + gmaps + '" target="_blank" rel="noopener">Открыть в Google Maps →</a></div>' +
  '</div>';
}

function renderSidebar(){
  var sb = document.getElementById('sidebar');
  var ids = Object.keys(state.agents);
  if (!ids.length){
    sb.innerHTML = '<div class="empty" id="sb-empty">Нет агентов</div>';
    return;
  }
  ids.sort(function(x,y){
    var a = state.agents[x], b = state.agents[y];
    if (a.online !== b.online) return a.online ? -1 : 1;
    return (b.lastSeen||0) - (a.lastSeen||0);
  });
  var html = '';
  ids.forEach(function(id){
    var a = state.agents[id];
    var gmaps = 'https://www.google.com/maps?q=' + a.lat + ',' + a.lng;
    html += '<div class="agent-row" data-id="' + escHtml(id) + '">' +
      '<div class="nm"><span class="dot ' + (a.online ? 'on' : 'off') + '"></span>' + escHtml(a.name || id) + '</div>' +
      (a.car ? '<div class="cr">🚗 ' + escHtml(a.car) + '</div>' : '') +
      '<div class="co">' + a.lat.toFixed(5) + ', ' + a.lng.toFixed(5) + '</div>' +
      '<div class="mt"><span>' + fmtTime(a.lastSeen) + ' · ' + humanAgo(a.lastSeen) + '</span>' +
      '<a href="' + gmaps + '" target="_blank" rel="noopener">Google Maps</a></div>' +
    '</div>';
  });
  sb.innerHTML = html;
  sb.querySelectorAll('.agent-row').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-id');
      var a = state.agents[id];
      if (a && a.lat != null){
        state.map.setView([a.lat, a.lng], Math.max(state.map.getZoom(), 15));
        if (a.marker) a.marker.openPopup();
        sb.classList.remove('open');
      }
    });
  });
}

function recomputeOnline(){
  var now = Date.now();
  var changed = false;
  Object.keys(state.agents).forEach(function(id){
    var a = state.agents[id];
    var on = (now - (a.lastSeen||0)) < ONLINE_MS;
    if (on !== a.online){ a.online = on; changed = true; }
    if (a.marker) upsertMarker(a);
  });
  if (changed) renderSidebar();
}

/* ---------------- обработка входящих ---------------- */
function setupMessageHandler(){
  state.client.on('message', async function(topic, payload){
    // фичи (агенты-видят-друг-друга и сообщения)
    if (window.RotaFeatures && await RotaFeatures.handleMessage(topic, payload)) return;

    if (topic.indexOf(state.topicPrefix + '/') !== 0) return;
    var suffix = topic.slice(state.topicPrefix.length + 1);
    if (suffix.charAt(0) === '_') return;   // служебные — мимо

    var obj = null;
    try { obj = await decryptPayload(payload); }
    catch(e){ dlog('Не удалось расшифровать от ' + suffix, 'w'); return; }
    if (!obj || typeof obj !== 'object') return;

    if (obj.t === 'off'){
      var a = state.agents[suffix];
      if (a){
        a.lastSeen = 0; a.online = false;
        if (a.marker) upsertMarker(a);
        renderSidebar();
      }
      dlog('← offline: ' + suffix, 'i');
      return;
    }

    // по умолчанию считаем это позицией
    if (obj.lat == null || obj.lng == null) return;

    var agent = ensureAgent(suffix, obj);
    upsertMarker(agent);
    renderSidebar();
    dlog('← ' + suffix + ' ' + obj.lat.toFixed(5) + ',' + obj.lng.toFixed(5), 'i');
  });
}

/* ---------------- кнопки ---------------- */
function fitAll(){
  var pts = [];
  Object.keys(state.agents).forEach(function(id){
    var a = state.agents[id];
    if (a.lat != null && a.lng != null) pts.push([a.lat, a.lng]);
  });
  if (!pts.length) return;
  if (pts.length === 1) state.map.setView(pts[0], 15);
  else state.map.fitBounds(L.latLngBounds(pts), { padding: [40,40], maxZoom: 16 });
}

function openGroupModal(){
  var cur = lsGet('disp.topic', '');
  var nw = prompt('Новый код группы (a-zA-Z0-9_-):', cur);
  if (nw == null) return;
  nw = sanitize(nw);
  if (!nw) { alert('Некорректный код'); return; }
  if (!confirm('Сменить группу на "' + nw + '"? Текущая сессия будет закрыта.')) return;
  lsSet('disp.topic', nw);
  location.reload();
}

/* ---------------- подключение ---------------- */
async function doConnect(){
  var code = sanitize(document.getElementById('in-topic').value);
  var key  = document.getElementById('in-key').value;
  if (!code || !key) { alert('Введите код и ключ группы'); return; }

  state.topic = code;
  state.key = key;
  state.broker = document.getElementById('in-broker').value;
  state.mapStyle = document.getElementById('in-map').value;

  lsSet('disp.topic', code);
  lsSet('disp.key', key);
  lsSet('disp.broker', state.broker);
  lsSet('disp.baseMap', state.mapStyle);

  try {
    dlog('Вывод ключей…', 'i');
    var hash = await deriveTopicHash(code, key);
    state.topicPrefix = 'rotacol-v1/' + hash;
    state.cryptoKey = await deriveAesKey(code, key);
    dlog('Топик: ' + state.topicPrefix, 'i');
    dlog('Хеш группы: ' + hash, 'i');
  } catch (e) {
    dlog('Крипто не работает: ' + (e.message || e), 'e');
    alert('Крипто не работает: ' + (e.message || e));
    return;
  }

  try {
    state.client = await connectAnyBroker();
    state.connected = true;
  } catch (e) {
    alert('Не удалось подключиться: ' + (e.message || e));
    return;
  }

  // UI
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.add('on');
  if (window.matchMedia('(max-width:820px)').matches){
    document.getElementById('btn-close').style.display = '';
  }

  initMap();
  setupMessageHandler();

  // подписка на всё в группе
  try {
    state.client.subscribe(state.topicPrefix + '/+', { qos:0 });
    dlog('Подписка: ' + state.topicPrefix + '/+', 'i');
  } catch(e){ dlog('subscribe fail: ' + e.message, 'e'); }

  // восстановление подписки при реконнекте
  state.client.on('connect', function(){
    state.connected = true;
    try { state.client.subscribe(state.topicPrefix + '/+', { qos:0 }); } catch(e){}
  });
  state.client.on('close', function(){ state.connected = false; dlog('MQTT close', 'w'); });

  // фичи
  if (window.RotaFeatures){
    RotaFeatures.attach({
      client:      state.client,
      topicPrefix: state.topicPrefix,
      encrypt:     encryptPayload,
      decrypt:     decryptPayload,
      dlog:        dlog
    });
  }

  // тикер обновления меток «N сек назад»
  state.tickTimer = setInterval(function(){
    recomputeOnline();
    renderSidebar();
  }, 5000);

  // показать FAB-лог на телефоне
  document.getElementById('fab-log').classList.remove('hidden');

  // диагностика
  dlog('secure context: ' + window.isSecureContext, 'i');
  dlog('crypto.subtle: ' + !!(window.crypto && crypto.subtle), 'i');
}

/* ---------------- init ---------------- */
(function init(){
  // заголовок для мобильного
  if (window.matchMedia('(max-width:820px)').matches){
    document.getElementById('btn-close').style.display = '';
  }

  // восстановить поля логина
  document.getElementById('in-topic').value  = lsGet('disp.topic', '');
  document.getElementById('in-key').value    = lsGet('disp.key', '');
  document.getElementById('in-broker').value = lsGet('disp.broker', 'auto');
  state.mapStyle = lsGet('disp.baseMap', 'positron');
  document.getElementById('in-map').value = state.mapStyle;

  document.getElementById('btn-connect').addEventListener('click', doConnect);

  document.getElementById('btn-all').addEventListener('click', fitAll);
  document.getElementById('btn-group').addEventListener('click', openGroupModal);

  var sidebar = document.getElementById('sidebar');
  document.getElementById('btn-close').addEventListener('click', function(){
    if (sidebar.classList.contains('open')) sidebar.classList.remove('open');
    else location.reload();
  });

  // тап по заголовку на мобильном — открыть/закрыть сайдбар
  document.querySelector('#header .title').addEventListener('click', function(){
    if (window.matchMedia('(max-width:820px)').matches){
      sidebar.classList.toggle('open');
    }
  });

  // лог
  var lm = document.getElementById('log-modal');
  function openLog(){ lm.classList.remove('hidden'); }
  function closeLog(){ lm.classList.add('hidden'); }
  document.getElementById('btn-log').addEventListener('click', openLog);
  document.getElementById('fab-log').addEventListener('click', openLog);
  document.getElementById('lg-close').addEventListener('click', closeLog);
  document.getElementById('lg-clear').addEventListener('click', function(){
    var b = document.getElementById('log-body'); if (b) b.innerHTML = '';
  });
  document.getElementById('lg-copy').addEventListener('click', function(){
    var b = document.getElementById('log-body');
    if (!b) return;
    var txt = b.innerText || b.textContent || '';
    if (navigator.clipboard) navigator.clipboard.writeText(txt);
  });
})();
</script>
